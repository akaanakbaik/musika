<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2818"/>
      <stop offset="100%" style="stop-color:#081a0e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954"/>
      <stop offset="100%" style="stop-color:#1ed760"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bg)" stroke="#1DB954" stroke-width="3"/>
  <!-- Outer ring glow -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#1DB95422" stroke-width="1"/>
  <!-- Music note - eighth note -->
  <g transform="translate(250,220)">
    <!-- Note head (oval) -->
    <ellipse cx="-15" cy="40" rx="18" ry="14" fill="url(#glow)" transform="rotate(-20,-15,40)"/>
    <!-- Stem -->
    <rect x="-12" y="-50" width="5" height="92" rx="2.5" fill="url(#glow)"/>
    <!-- Flag -->
    <path d="M-7,-50 C15,-45 35,-30 30,-15 C28,-22 20,-30 5,-33 C-2,-35 -7,-42 -7,-50Z" fill="url(#glow)"/>
  </g>
  <!-- Sound waves -->
  <g transform="translate(250,250)" opacity="0.3">
    <path d="M-50,20 C-60,0 -60,-20 -50,-40" stroke="#1DB954" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-60,30 C-75,0 -75,-30 -60,-55" stroke="#1DB954" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-70,40 C-90,0 -90,-40 -70,-70" stroke="#1DB954" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Play button triangle -->
  <polygon points="310,235 310,265 335,250" fill="#1DB954" opacity="0.4"/>
  <!-- Text: Musika -->
  <g transform="translate(250,380)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="72" fill="url(#glow)" letter-spacing="6">musi<span fill="#ffffff">ka</span></text>
  </g>
  <!-- Small decorative dot -->
  <circle cx="250" cy="420" r="3" fill="#1DB95444"/>
</svg>
