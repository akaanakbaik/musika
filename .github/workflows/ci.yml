name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm
      - run: pnpm install --filter @workspace/api-server --no-frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install -g pnpm
      - run: pnpm install --filter @workspace/api-server --no-frozen-lockfile --ignore-scripts
      - name: Build server
        run: pnpm run build
      - name: Start server & run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --enable-source-maps ./dist/index.mjs &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in $(seq 1 15); do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Server ready!"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          npx vitest run --reporter=verbose --reporter=json --outputFile=test-results.json || true
          kill $SERVER_PID 2>/dev/null || true

  deploy:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: artifacts/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm vercel
      - run: pnpm install --filter @workspace/api-server --no-frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
